global:
  resolve_timeout: 5m

route:
  receiver: platform-warning
  group_by:
    - alertname
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - receiver: platform-critical
      matchers:
        - severity="critical"
      repeat_interval: 15m

receivers:
  - name: platform-critical
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
        max_alerts: 20
  - name: platform-warning
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
        max_alerts: 20

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - service
