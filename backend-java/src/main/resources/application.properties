spring.application.name=sacco-backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:sacco_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}

# Include the per-request correlation id (set by RequestCorrelationFilter) in local text logs.
logging.pattern.level=%5p [%X{correlationId:-}]

# Outbound HTTP client timeouts. The MTN/Airtel/M-Pesa and SMS providers all use the
# auto-configured RestClient.Builder, so these bound every external call and stop a slow or hung
# provider from holding request threads indefinitely. Overridable per environment.
spring.http.client.connect-timeout=${SACCO_HTTP_CONNECT_TIMEOUT:5s}
spring.http.client.read-timeout=${SACCO_HTTP_READ_TIMEOUT:20s}

# Per-IP rate limiting for abuse-prone endpoints (MFA verify + password-reset, member payment
# initiation, and provider callbacks as a flood ceiling). Counts are per client IP per window.
# Login is NOT included here; it uses failure-based lockout (LoginAttemptService).
sacco.rate-limit.enabled=${SACCO_RATE_LIMIT_ENABLED:true}
sacco.rate-limit.window=${SACCO_RATE_LIMIT_WINDOW:60s}
sacco.rate-limit.auth-per-window=${SACCO_RATE_LIMIT_AUTH:30}
sacco.rate-limit.payment-per-window=${SACCO_RATE_LIMIT_PAYMENT:20}
sacco.rate-limit.callback-per-window=${SACCO_RATE_LIMIT_CALLBACK:600}
sacco.idempotency.store=${SACCO_IDEMPOTENCY_STORE:memory}
sacco.idempotency.ttl=${SACCO_IDEMPOTENCY_TTL:PT24H}
sacco.redis.url=${SACCO_REDIS_URL:}

# Scheduled purge of expired security artefacts (login sessions, MFA challenges, password-reset
# tokens) so those tables stay bounded. Retentions are a grace period after expiry.
sacco.cleanup.cron=${SACCO_CLEANUP_CRON:0 30 3 * * *}
sacco.cleanup.session-retention=${SACCO_CLEANUP_SESSION_RETENTION:7d}
sacco.cleanup.mfa-retention=${SACCO_CLEANUP_MFA_RETENTION:1d}
sacco.cleanup.password-reset-retention=${SACCO_CLEANUP_PASSWORD_RESET_RETENTION:7d}

sacco.demo-logins.enabled=${SACCO_DEMO_LOGINS_ENABLED:true}
sacco.providers.sms=${SACCO_SMS_PROVIDER:demo_sms}
sacco.providers.email=${SACCO_EMAIL_PROVIDER:demo_email}
sacco.providers.mobile-money=${SACCO_MOBILE_MONEY_PROVIDER:demo_mobile_money}
sacco.pii.encryption-key=${SACCO_PII_ENCRYPTION_KEY:local-development-pii-encryption-key-2026}
sacco.document-storage.provider=${SACCO_DOCUMENT_STORAGE_PROVIDER:demo_noop}
sacco.document-storage.local-root=${SACCO_DOCUMENT_STORAGE_LOCAL_ROOT:}

spring.mail.host=${SACCO_GMAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SACCO_GMAIL_SMTP_PORT:587}
spring.mail.username=${SACCO_GMAIL_SMTP_USERNAME:}
spring.mail.password=${SACCO_GMAIL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SACCO_GMAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SACCO_GMAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.trust=${SACCO_GMAIL_SMTP_SSL_TRUST:*}
sacco.integrations.email.gmail.from-address=${SACCO_GMAIL_FROM_ADDRESS:}
sacco.integrations.email.gmail.from-name=${SACCO_GMAIL_FROM_NAME:Tereka Online}
sacco.integrations.sms.afrosms.base-url=${SACCO_AFROSMS_BASE_URL:https://www.afrosms.ug}
sacco.integrations.sms.afrosms.send-path=${SACCO_AFROSMS_SEND_PATH:/smskings/api.php}
sacco.integrations.sms.afrosms.balance-path=${SACCO_AFROSMS_BALANCE_PATH:/smskings/balance_api.php}
sacco.integrations.sms.afrosms.email=${SACCO_AFROSMS_EMAIL:}
sacco.integrations.sms.afrosms.password=${SACCO_AFROSMS_PASSWORD:}
sacco.integrations.sms.afrosms.source=${SACCO_AFROSMS_SOURCE:Tereka}

sacco.bootstrap.platform-admin.full-name=${SACCO_BOOTSTRAP_PLATFORM_ADMIN_FULL_NAME:}
sacco.bootstrap.platform-admin.email=${SACCO_BOOTSTRAP_PLATFORM_ADMIN_EMAIL:}
sacco.bootstrap.platform-admin.phone=${SACCO_BOOTSTRAP_PLATFORM_ADMIN_PHONE:}
sacco.bootstrap.platform-admin.password=${SACCO_BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:}

# Mobile-money callback authentication (HMAC-SHA256 over the raw body).
# Left blank for local/demo, so callbacks stay unsigned in development.
sacco.integrations.mobile-money.callback-secret=${SACCO_MOBILE_MONEY_CALLBACK_SECRET:}
sacco.integrations.mobile-money.require-signed-callbacks=${SACCO_MOBILE_MONEY_REQUIRE_SIGNED_CALLBACKS:false}
sacco.integrations.mobile-money.callback-timestamp-tolerance-seconds=${SACCO_MOBILE_MONEY_CALLBACK_TIMESTAMP_TOLERANCE_SECONDS:300}
sacco.integrations.mobile-money.reconciliation.enabled=${SACCO_MOBILE_MONEY_RECONCILIATION_ENABLED:true}
sacco.integrations.mobile-money.reconciliation.initial-delay=${SACCO_MOBILE_MONEY_RECONCILIATION_INITIAL_DELAY:PT1M}
sacco.integrations.mobile-money.reconciliation.fixed-delay=${SACCO_MOBILE_MONEY_RECONCILIATION_FIXED_DELAY:PT5M}
sacco.integrations.mobile-money.reconciliation.batch-size=${SACCO_MOBILE_MONEY_RECONCILIATION_BATCH_SIZE:50}
sacco.integrations.mobile-money.mtn.base-url=${SACCO_MTN_MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
sacco.integrations.mobile-money.mtn.subscription-key=${SACCO_MTN_MOMO_SUBSCRIPTION_KEY:}
sacco.integrations.mobile-money.mtn.api-user-id=${SACCO_MTN_MOMO_API_USER_ID:}
sacco.integrations.mobile-money.mtn.api-key=${SACCO_MTN_MOMO_API_KEY:}
sacco.integrations.mobile-money.mtn.target-environment=${SACCO_MTN_MOMO_TARGET_ENVIRONMENT:sandbox}
sacco.integrations.mobile-money.airtel.base-url=${SACCO_AIRTEL_MONEY_BASE_URL:https://openapi.airtel.africa}
sacco.integrations.mobile-money.airtel.client-id=${SACCO_AIRTEL_MONEY_CLIENT_ID:}
sacco.integrations.mobile-money.airtel.client-secret=${SACCO_AIRTEL_MONEY_CLIENT_SECRET:}
sacco.integrations.mobile-money.airtel.country-code=${SACCO_AIRTEL_MONEY_COUNTRY_CODE:UG}
sacco.integrations.mobile-money.airtel.token-path=${SACCO_AIRTEL_MONEY_TOKEN_PATH:/auth/oauth2/token}
sacco.integrations.mobile-money.airtel.payment-path=${SACCO_AIRTEL_MONEY_PAYMENT_PATH:/merchant/v1/payments/}
sacco.integrations.mobile-money.airtel.status-path=${SACCO_AIRTEL_MONEY_STATUS_PATH:/standard/v1/payments/{transactionId}}
sacco.integrations.mobile-money.mpesa.base-url=${SACCO_MPESA_DARAJA_BASE_URL:https://sandbox.safaricom.co.ke}
sacco.integrations.mobile-money.mpesa.consumer-key=${SACCO_MPESA_DARAJA_CONSUMER_KEY:}
sacco.integrations.mobile-money.mpesa.consumer-secret=${SACCO_MPESA_DARAJA_CONSUMER_SECRET:}
sacco.integrations.mobile-money.mpesa.business-short-code=${SACCO_MPESA_DARAJA_BUSINESS_SHORT_CODE:}
sacco.integrations.mobile-money.mpesa.passkey=${SACCO_MPESA_DARAJA_PASSKEY:}
sacco.integrations.mobile-money.mpesa.callback-url=${SACCO_MPESA_DARAJA_CALLBACK_URL:}
sacco.integrations.mobile-money.mpesa.transaction-type=${SACCO_MPESA_DARAJA_TRANSACTION_TYPE:CustomerPayBillOnline}
sacco.integrations.mobile-money.mpesa.party-b=${SACCO_MPESA_DARAJA_PARTY_B:}
sacco.integrations.mobile-money.mpesa.token-path=${SACCO_MPESA_DARAJA_TOKEN_PATH:/oauth/v1/generate?grant_type=client_credentials}
sacco.integrations.mobile-money.mpesa.stk-push-path=${SACCO_MPESA_DARAJA_STK_PUSH_PATH:/mpesa/stkpush/v1/processrequest}
sacco.integrations.mobile-money.mpesa.stk-query-path=${SACCO_MPESA_DARAJA_STK_QUERY_PATH:/mpesa/stkpushquery/v1/query}
