spring.application.name=sacco-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sacco_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sacco}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sacco}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.forward-headers-strategy=framework

sacco.demo-logins.enabled=${SACCO_DEMO_LOGINS_ENABLED:false}
sacco.providers.sms=${SACCO_SMS_PROVIDER:}
sacco.providers.email=${SACCO_EMAIL_PROVIDER:}
sacco.providers.mobile-money=${SACCO_MOBILE_MONEY_PROVIDER:}

sacco.bootstrap.platform-admin.full-name=${SACCO_BOOTSTRAP_PLATFORM_ADMIN_FULL_NAME:}
sacco.bootstrap.platform-admin.email=${SACCO_BOOTSTRAP_PLATFORM_ADMIN_EMAIL:}
sacco.bootstrap.platform-admin.phone=${SACCO_BOOTSTRAP_PLATFORM_ADMIN_PHONE:}
sacco.bootstrap.platform-admin.password=${SACCO_BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:}

# Mobile-money callback authentication (HMAC-SHA256 over the raw body).
# Production fails closed: signed callbacks are required, so a missing secret rejects all callbacks.
sacco.integrations.mobile-money.callback-secret=${SACCO_MOBILE_MONEY_CALLBACK_SECRET:}
sacco.integrations.mobile-money.require-signed-callbacks=${SACCO_MOBILE_MONEY_REQUIRE_SIGNED_CALLBACKS:true}
sacco.integrations.mobile-money.callback-timestamp-tolerance-seconds=${SACCO_MOBILE_MONEY_CALLBACK_TIMESTAMP_TOLERANCE_SECONDS:300}
sacco.integrations.mobile-money.mtn.base-url=${SACCO_MTN_MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
sacco.integrations.mobile-money.mtn.subscription-key=${SACCO_MTN_MOMO_SUBSCRIPTION_KEY:}
sacco.integrations.mobile-money.mtn.api-user-id=${SACCO_MTN_MOMO_API_USER_ID:}
sacco.integrations.mobile-money.mtn.api-key=${SACCO_MTN_MOMO_API_KEY:}
sacco.integrations.mobile-money.mtn.target-environment=${SACCO_MTN_MOMO_TARGET_ENVIRONMENT:}
sacco.integrations.mobile-money.airtel.base-url=${SACCO_AIRTEL_MONEY_BASE_URL:https://openapi.airtel.africa}
sacco.integrations.mobile-money.airtel.client-id=${SACCO_AIRTEL_MONEY_CLIENT_ID:}
sacco.integrations.mobile-money.airtel.client-secret=${SACCO_AIRTEL_MONEY_CLIENT_SECRET:}
sacco.integrations.mobile-money.airtel.country-code=${SACCO_AIRTEL_MONEY_COUNTRY_CODE:}
sacco.integrations.mobile-money.airtel.token-path=${SACCO_AIRTEL_MONEY_TOKEN_PATH:/auth/oauth2/token}
sacco.integrations.mobile-money.airtel.payment-path=${SACCO_AIRTEL_MONEY_PAYMENT_PATH:/merchant/v1/payments/}
sacco.integrations.mobile-money.airtel.status-path=${SACCO_AIRTEL_MONEY_STATUS_PATH:/standard/v1/payments/{transactionId}}
