spring.application.name=sacco-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sacco_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sacco}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sacco}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.forward-headers-strategy=framework

sacco.demo-logins.enabled=${SACCO_DEMO_LOGINS_ENABLED:false}
sacco.providers.sms=${SACCO_SMS_PROVIDER:}
sacco.providers.email=${SACCO_EMAIL_PROVIDER:}
sacco.providers.mobile-money=${SACCO_MOBILE_MONEY_PROVIDER:}

# Mobile-money callback authentication (HMAC-SHA256 over the raw body).
# Production fails closed: signed callbacks are required, so a missing secret rejects all callbacks.
sacco.integrations.mobile-money.callback-secret=${SACCO_MOBILE_MONEY_CALLBACK_SECRET:}
sacco.integrations.mobile-money.require-signed-callbacks=${SACCO_MOBILE_MONEY_REQUIRE_SIGNED_CALLBACKS:true}
sacco.integrations.mobile-money.callback-timestamp-tolerance-seconds=${SACCO_MOBILE_MONEY_CALLBACK_TIMESTAMP_TOLERANCE_SECONDS:300}
